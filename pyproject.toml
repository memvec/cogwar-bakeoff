[project]
name = "cogwar-bakeoff"
version = "0.1.0"
description = "Model selection bake-off for CIB detection in Hindi/English/Urdu."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only `collection`/`processing`/`analysis`/`serve` are importable packages
# under src/; other top-level files there (e.g. check_env.py) are standalone
# scripts, not distributed.
packages = ["src/collection", "src/processing", "src/analysis", "src/serve"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
process = [
    "duckdb>=1.0",
]
analysis = [
    "duckdb>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "ollama>=0.4",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
]
serve = [
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ollama>=0.4",
]
ml = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "peft>=0.12",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "bitsandbytes>=0.43 ; sys_platform == 'linux'",
]
collect = [
    "telethon>=1.36",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "pyarrow>=17.0",
    "langdetect>=1.0.9",
    "google-api-python-client>=2.100",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.8",
    "faster-whisper>=1.0",
    "imagehash>=4.3",
    "pillow>=10.0",
]
