<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal — Coordination &amp; Narrative Analysis</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◆</span>
    <span class="brand-name">Signal</span>
  </div>
  <div id="stats" class="stats-strip">
    <div class="stat"><span class="stat-value">—</span><span class="stat-label">items</span></div>
    <div class="stat"><span class="stat-value">—</span><span class="stat-label">authors</span></div>
    <div class="stat"><span class="stat-value">—</span><span class="stat-label">entities</span></div>
    <div class="stat"><span class="stat-value">—</span><span class="stat-label">stance edges</span></div>
    <div class="stat"><span class="stat-value">—</span><span class="stat-label">coordination clusters</span></div>
  </div>
</header>

<section class="hero">
  <h1 class="hero-title">Ask about the coordination data</h1>
  <p class="hero-subtitle">Plain-language questions over stance, coordination and narrative signal — every answer traces back to the real posts behind it.</p>

  <form id="askForm" class="ask-form" autocomplete="off">
    <svg class="ask-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/>
      <line x1="13.6" y1="13.6" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="askInput" type="text" placeholder="e.g. who is most anti-Pakistan?" spellcheck="false">
    <button type="submit" id="askSubmit">
      <span class="btn-label">Ask</span>
      <span class="btn-spinner" aria-hidden="true"></span>
    </button>
  </form>

  <div class="chips" id="exampleChips">
    <button class="chip" type="button" data-q="Who is most anti-Pakistan?">Who is most anti-Pakistan?</button>
    <button class="chip" type="button" data-q="Show coordination around Operation Sindoor">Show coordination around Operation Sindoor</button>
    <button class="chip" type="button" data-q="What is Resonant News's stance on Pakistan?">What is Resonant News's stance on Pakistan?</button>
  </div>

  <button id="networkToggle" class="network-toggle" type="button">
    Explore the full coordination network <span aria-hidden="true">→</span>
  </button>
</section>

<main class="results-shell">
  <nav id="breadcrumbs" class="breadcrumbs hidden"></nav>
  <div id="resultsArea" class="results-area"></div>
</main>

<div id="tooltip" class="tooltip hidden"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="app.js"></script>
</body>
</html>
